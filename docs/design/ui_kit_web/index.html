<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Demo Platform — UI Kit</title>
<link rel="icon" href="../assets/logo-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="ui-kit.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="i18n.jsx"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="ui.jsx"></script>
<script type="text/babel" src="Shell.jsx"></script>
<script type="text/babel" src="DemoRag.jsx"></script>
<script type="text/babel" src="DemoComparator.jsx"></script>
<script type="text/babel" src="DemoCorpus.jsx"></script>
<script type="text/babel" src="DemoAgent.jsx"></script>

<script type="text/babel">
const { useState, useEffect, useMemo } = React;

function App() {
  const [demoId, setDemoId] = useState('rag');
  const [theme, setTheme] = useState(() => localStorage.getItem('adp-theme') || 'light');
  const [lang, setLang] = useLang();
  const t = useMemo(() => makeT(lang), [lang]);

  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('adp-theme', theme);
  }, [theme]);

  const toggleTheme = () => setTheme((th) => th === 'light' ? 'dark' : 'light');
  const toggleLang  = () => setLang((l) => l === 'es' ? 'en' : 'es');

  let view = null;
  if (demoId === 'rag') view = <DemoRag />;
  else if (demoId === 'comparator') view = <DemoComparator />;
  else if (demoId === 'corpus') view = <DemoCorpus />;
  else if (demoId === 'agent') view = <DemoAgent />;

  return (
    <LangContext.Provider value={{ lang, t, setLang }}>
      <Shell
        activeDemoId={demoId}
        onSelectDemo={setDemoId}
        theme={theme}
        onToggleTheme={toggleTheme}
        lang={lang}
        onToggleLang={toggleLang}
      >
        {view}
      </Shell>
    </LangContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
